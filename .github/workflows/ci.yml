name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Check formatting
        run: uv run ruff format --check src tests scripts

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Security lint
        run: uv run bandit -r src scripts -c pyproject.toml

      - name: Validate development API definition
        run: |
          uv run pygeoapi config validate \
            --config config/pygeoapi.development.yml
          uv run pygeoapi openapi generate \
            --format yaml \
            --output-file /tmp/development-openapi.yml \
            config/pygeoapi.development.yml
          uv run pygeoapi openapi validate \
            /tmp/development-openapi.yml

      - name: Validate integration API definition
        env:
          PYTHONPATH: ${{ github.workspace }}/tests/fixtures
        run: |
          uv run pygeoapi config validate \
            --config config/pygeoapi.integration.yml
          uv run pygeoapi openapi generate \
            --format yaml \
            --output-file /tmp/integration-openapi.yml \
            config/pygeoapi.integration.yml
          uv run pygeoapi openapi validate \
            /tmp/integration-openapi.yml

      - name: Test with coverage
        run: uv run pytest --cov=bkn_terrain_processes --cov-report=term-missing --cov-fail-under=30

  container-smoke:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js for the Geonovum checker
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start API
        env:
          PYGEOAPI_SERVER_URL: http://127.0.0.1:5001
        run: docker compose up --build --detach

      - name: Check API discovery resources
        run: python3 scripts/smoke_discovery.py --base-url http://127.0.0.1:5001 --wait-seconds 60

      - name: Compare Geonovum diagnostics with the reviewed baseline
        run: |
          python3 scripts/check_geonovum_baseline.py \
            --raw-output /tmp/geonovum-checker.json

      - name: Upload Geonovum checker output after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: geonovum-checker-output
          path: /tmp/geonovum-checker.json
          if-no-files-found: ignore

      - name: Show API logs after failure
        if: failure()
        run: docker compose logs --no-color api

      - name: Stop API
        if: always()
        run: docker compose down --volumes --remove-orphans

  live-point-baseline:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Compare calculations with the live point baseline
        run: |
          status=0
          uv run python scripts/check_live_point_baseline.py || status=$?

          if [ "$status" -eq 2 ]; then
            echo "PDOK data was unavailable; retrying once after 15 seconds."
            sleep 15
            status=0
            uv run python scripts/check_live_point_baseline.py || status=$?
          fi

          exit "$status"
