services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: bkn-terrain-processes-dev:0.23.4
    pull_policy: build
    ports:
      - "${API_PORT:-5001}:80"
    environment:
      PYGEOAPI_SERVER_URL: ${PYGEOAPI_SERVER_URL:-http://localhost:5001}
      PYTHONPATH: /pygeoapi
      WSGI_APP: bkn_terrain_processes.app:APP
    volumes:
      - ./config/pygeoapi.development.yml:/pygeoapi/local.config.yml:ro
      - ./src/bkn_terrain_processes:/pygeoapi/bkn_terrain_processes:ro
    healthcheck:
      test:
        - CMD
        - /venv/bin/python3
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost/conformance', timeout=5)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
